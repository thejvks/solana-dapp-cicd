[package]
name = "counter"
version = "0.1.0"
description = "A simple counter program for Solana CI/CD pipeline demonstration"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "counter"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"

[lints.clippy]
result_large_err = "allow"

[lints.rust]
unexpected_cfgs = { level = "allow" }
