# =============================================================================
# CI Pipeline — Runs on every Pull Request and push to develop
# =============================================================================
# Stages: Lint → Test → Build
# Purpose: Catch bugs BEFORE they reach main branch
# =============================================================================

name: CI — Lint, Test & Build

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
    paths:
      - 'programs/**'
      - 'tests/**'
      - 'app/**'
      - '.github/workflows/**'
      - 'Anchor.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: "1.18.26"
  ANCHOR_VERSION: "0.30.1"
  NODE_VERSION: "20"

jobs:
  # ===========================================================================
  # Stage 1: LINT — Code quality checks
  # ===========================================================================
  lint-program:
    name: "🔍 Lint Solana Program"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust 1.78.0
        uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: rustfmt

      - name: Run cargo fmt check
        run: cargo fmt --all -- --check

  lint-frontend:
    name: "🔍 Lint Frontend"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Run ESLint
        working-directory: app
        run: npx eslint . --ext .ts,.tsx --max-warnings 5

      - name: Run TypeScript type check
        working-directory: app
        run: npx tsc --noEmit --skipLibCheck

  # ===========================================================================
  # Stage 2: TEST — Run Anchor integration tests on localnet
  # ===========================================================================
  test:
    name: "🧪 Anchor Tests"
    runs-on: ubuntu-latest
    needs: [lint-program, lint-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust 1.78.0 (compatible with Solana 1.18 / Anchor 0.30)
        uses: dtolnay/rust-toolchain@1.78.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-registry-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_VERSION }} anchor-cli --force
          anchor --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install test dependencies
        run: npm ci

      - name: Generate keypair for tests
        run: solana-keygen new --no-bip39-passphrase --silent

      - name: Run Anchor tests
        run: anchor test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # ===========================================================================
  # Stage 3: BUILD — Compile program and frontend
  # ===========================================================================
  build-program:
    name: "🔨 Build Solana Program"
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust 1.78.0 (compatible with Solana 1.18 / Anchor 0.30)
        uses: dtolnay/rust-toolchain@1.78.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-registry-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_VERSION }} anchor-cli --force
          anchor --version

      - name: Build program
        run: anchor build

      - name: Upload program artifact (.so file)
        uses: actions/upload-artifact@v4
        with:
          name: program-build
          path: |
            target/deploy/counter.so
            target/idl/counter.json
            target/types/counter.ts
          retention-days: 30

      - name: Display build info
        run: |
          echo "=== Program Build Output ==="
          ls -lh target/deploy/counter.so
          echo "Program size: $(wc -c < target/deploy/counter.so) bytes"
          echo "IDL generated: $(ls target/idl/counter.json 2>/dev/null && echo 'Yes' || echo 'No')"

  build-frontend:
    name: "🔨 Build Frontend"
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build Next.js frontend
        working-directory: app
        run: npm run build
        env:
          NEXT_PUBLIC_SOLANA_NETWORK: devnet
          NEXT_PUBLIC_PROGRAM_ID: "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: app/.next/
          retention-days: 7

  # ===========================================================================
  # Summary Job — Reports overall CI status
  # ===========================================================================
  ci-summary:
    name: "📊 CI Summary"
    runs-on: ubuntu-latest
    needs: [lint-program, lint-frontend, test, build-program, build-frontend]
    if: always()
    steps:
      - name: CI Pipeline Summary
        run: |
          echo "## CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint Program | ${{ needs.lint-program.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint Frontend | ${{ needs.lint-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Program | ${{ needs.build-program.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Frontend | ${{ needs.build-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
