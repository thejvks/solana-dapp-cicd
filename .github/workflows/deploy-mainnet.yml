# =============================================================================
# Deploy to Mainnet — Production deployment with manual approval gate
# =============================================================================
# Trigger: Manual dispatch ONLY (never auto-deploy to mainnet)
# Requires: Successful devnet deployment + manual approval from team lead
# =============================================================================

name: Deploy to Mainnet (Production)

on:
  workflow_dispatch:
    inputs:
      devnet_verified:
        description: 'Confirm devnet deployment is verified and working'
        required: true
        type: boolean
        default: false
      commit_sha:
        description: 'Specific commit SHA to deploy (leave empty for latest main)'
        required: false
      rollback_to:
        description: 'Buffer address to rollback to (leave empty for new deploy)'
        required: false

env:
  SOLANA_VERSION: "2.1.15"
  ANCHOR_VERSION: "0.32.1"
  NODE_VERSION: "20"

jobs:
  # ===========================================================================
  # Pre-flight checks
  # ===========================================================================
  preflight:
    name: "🔍 Pre-flight Checks"
    runs-on: ubuntu-latest
    steps:
      - name: Verify devnet confirmation
        if: ${{ !inputs.devnet_verified && inputs.rollback_to == '' }}
        run: |
          echo "❌ You must confirm devnet deployment is verified before mainnet deploy!"
          echo "Check the devnet deployment, run smoke tests, then re-run with confirmation."
          exit 1

      - name: Deployment info
        run: |
          echo "## 🚀 Mainnet Deployment Initiated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.rollback_to }}" ]; then
            echo "**Mode:** ROLLBACK to buffer \`${{ inputs.rollback_to }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Mode:** NEW DEPLOYMENT" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Initiated by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Devnet verified:** ${{ inputs.devnet_verified }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Rollback path — Quick rollback using saved buffer
  # ===========================================================================
  rollback:
    name: "⏪ Rollback to Previous Version"
    runs-on: ubuntu-latest
    needs: [preflight]
    if: ${{ inputs.rollback_to != '' }}
    environment: mainnet
    steps:
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Configure Solana for mainnet
        run: |
          solana config set --url ${{ secrets.MAINNET_SOLANA_RPC_URL }}
          echo "${{ secrets.MAINNET_DEPLOYER_KEYPAIR }}" > deployer.json
          solana config set --keypair deployer.json

      - name: Execute rollback
        run: |
          echo "Rolling back to buffer: ${{ inputs.rollback_to }}"
          solana program deploy \
            --buffer ${{ inputs.rollback_to }} \
            --program-id $(solana-keygen pubkey target/deploy/counter-keypair.json) \
            --keypair deployer.json
          echo "✅ Rollback completed!"

  # ===========================================================================
  # Normal deploy path — Build, deploy program, deploy frontend
  # ===========================================================================
  build:
    name: "🔨 Build for Mainnet"
    runs-on: ubuntu-latest
    needs: [preflight]
    if: ${{ inputs.rollback_to == '' }}
    outputs:
      program_id: ${{ steps.info.outputs.program_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || 'main' }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_VERSION }} anchor-cli --locked --force
          anchor --version

      - name: Build program
        run: anchor build

      - name: Extract program info
        id: info
        run: |
          PROGRAM_ID=$(solana-keygen pubkey target/deploy/counter-keypair.json 2>/dev/null || echo "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS")
          echo "program_id=$PROGRAM_ID" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-build
          path: |
            target/deploy/counter.so
            target/deploy/counter-keypair.json
            target/idl/counter.json

  deploy-program:
    name: "🚀 Deploy Program to Mainnet"
    runs-on: ubuntu-latest
    needs: [build]
    environment: mainnet  # <-- This triggers the manual approval gate in GitHub
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: mainnet-build
          path: target/deploy/

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Configure Solana for mainnet
        run: |
          solana config set --url ${{ secrets.MAINNET_SOLANA_RPC_URL }}
          echo "${{ secrets.MAINNET_DEPLOYER_KEYPAIR }}" > deployer.json
          solana config set --keypair deployer.json

      - name: Save current buffer for rollback
        id: save-buffer
        continue-on-error: true
        run: |
          # Write the current program to a buffer so we can rollback if needed
          echo "Saving current program state for potential rollback..."
          BUFFER=$(solana program write-buffer target/deploy/counter.so 2>/dev/null | grep -oP 'Buffer: \K\S+' || echo "NONE")
          echo "rollback_buffer=$BUFFER" >> $GITHUB_OUTPUT
          echo "Rollback buffer saved: $BUFFER"

      - name: Deploy to mainnet
        run: |
          echo "🚀 Deploying to MAINNET..."
          solana program deploy \
            target/deploy/counter.so \
            --program-id ${{ needs.build.outputs.program_id }} \
            --keypair deployer.json \
            --with-compute-unit-price 50000
          echo "✅ Mainnet deployment successful!"

      - name: Upload IDL
        continue-on-error: true
        run: |
          anchor idl upgrade --provider.cluster mainnet \
            --filepath target/idl/counter.json \
            ${{ needs.build.outputs.program_id }} 2>/dev/null || \
          echo "IDL upload skipped"

      - name: Save rollback info
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-rollback-${{ github.sha }}
          path: |
            target/deploy/counter.so
          retention-days: 90

  deploy-frontend-prod:
    name: "🌐 Deploy Frontend to Production"
    runs-on: ubuntu-latest
    needs: [deploy-program, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Pull Vercel environment
        working-directory: app
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for production
        working-directory: app
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SOLANA_NETWORK: mainnet-beta
          NEXT_PUBLIC_PROGRAM_ID: ${{ needs.build.outputs.program_id }}

      - name: Deploy to production
        working-directory: app
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "🌐 Production frontend: $DEPLOY_URL"

  # ===========================================================================
  # Notify team of mainnet deployment
  # ===========================================================================
  notify:
    name: "📢 Notify Team"
    runs-on: ubuntu-latest
    needs: [deploy-program, deploy-frontend-prod]
    if: always()
    steps:
      - name: Send Slack notification
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ needs.deploy-program.result == 'success' && '🚀 MAINNET Deploy Successful!' || '🔴 MAINNET Deploy Failed!' }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Deployed by:*\n${{ github.actor }}" },
                    { "type": "mrkdwn", "text": "*Commit:*\n`${{ github.sha }}`" },
                    { "type": "mrkdwn", "text": "*Program:*\n${{ needs.deploy-program.result }}" },
                    { "type": "mrkdwn", "text": "*Frontend:*\n${{ needs.deploy-frontend-prod.result }}" }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    { "type": "mrkdwn", "text": "Run rollback workflow with buffer address if issues are detected." }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Post summary
        run: |
          echo "## 🚀 Mainnet Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Program | ${{ needs.deploy-program.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.deploy-frontend-prod.result }} |" >> $GITHUB_STEP_SUMMARY
